<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" font-family="'SF Arabic','Geeza Pro',Tahoma,'Segoe UI',Arial,sans-serif">
  <title id="t">نوا رادار، اسکنر IP سالم کلودفلر برای دسکتاپ</title>
  <desc id="d">اپلیکیشن دسکتاپ نوا رادار که با Go و React ساخته شده، IPهای سالم کلودفلر را اسکن و بر اساس سرعت مرتب می‌کند. سمت چپ یک اسکوپ رادار و فهرست نتایج مرتب‌شده با آی‌پی و زمان پاسخ نمایش داده شده است.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#9d4efb"/>
    </linearGradient>
    <linearGradient id="brandH" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#9d4efb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b3a54" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1b3a54" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(168 210) rotate(-52) scale(96)">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scopeClip"><circle cx="168" cy="210" r="96"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="398" rx="26" fill="#07090f"/>
  <rect x="1" y="1" width="1198" height="398" rx="26" fill="none" stroke="#161d2e" stroke-width="2"/>
  <ellipse cx="300" cy="210" rx="360" ry="300" fill="url(#glow)"/>

  <!-- ===== LEFT: radar + ranked results (glass panel) ===== -->
  <g>
    <rect x="48" y="56" width="504" height="288" rx="18" fill="#0c1120"/>
    <rect x="48" y="56" width="504" height="288" rx="18" fill="none" stroke="#1e2740" stroke-width="1.5"/>
    <!-- window title bar (frameless desktop) -->
    <circle cx="72" cy="80" r="5" fill="#f87171"/>
    <circle cx="90" cy="80" r="5" fill="#fbbf24"/>
    <circle cx="108" cy="80" r="5" fill="#34d399"/>
    <text x="528" y="85" text-anchor="start" direction="rtl" font-size="16" fill="#8a93ad">نوا رادار</text>
    <line x1="48" y1="100" x2="552" y2="100" stroke="#1e2740" stroke-width="1.5"/>

    <!-- radar scope -->
    <circle cx="168" cy="210" r="96" fill="#081324"/>
    <g clip-path="url(#scopeClip)">
      <circle cx="168" cy="210" r="32" fill="none" stroke="#1c3a52" stroke-width="1.5"/>
      <circle cx="168" cy="210" r="64" fill="none" stroke="#1c3a52" stroke-width="1.5"/>
      <circle cx="168" cy="210" r="96" fill="none" stroke="#1c3a52" stroke-width="1.5"/>
      <line x1="72" y1="210" x2="264" y2="210" stroke="#1c3a52" stroke-width="1.5"/>
      <line x1="168" y1="114" x2="168" y2="306" stroke="#1c3a52" stroke-width="1.5"/>
      <path d="M168 210 L168 114 A96 96 0 0 1 227 130 Z" fill="url(#sweep)"/>
      <line x1="168" y1="210" x2="227" y2="130" stroke="#22d3ee" stroke-width="2"/>
      <!-- blips -->
      <circle cx="205" cy="168" r="4.5" fill="#34d399"/>
      <circle cx="132" cy="245" r="4" fill="#22d3ee"/>
      <circle cx="210" cy="238" r="3.5" fill="#22d3ee"/>
      <circle cx="140" cy="176" r="3" fill="#8a93ad"/>
    </g>
    <circle cx="168" cy="210" r="96" fill="none" stroke="#274063" stroke-width="1.5"/>
    <circle cx="168" cy="210" r="3.5" fill="#22d3ee"/>

    <!-- ranked results -->
    <text x="524" y="128" text-anchor="start" direction="rtl" font-size="15" fill="#6f7891">مرتب‌شده بر اساس سرعت (ms)</text>
    <g font-family="'SF Mono','Menlo',monospace">
      <!-- row 1 (fastest) -->
      <rect x="288" y="140" width="240" height="40" rx="9" fill="#101a30"/>
      <rect x="288" y="140" width="3" height="40" rx="1.5" fill="url(#brand)"/>
      <text x="304" y="165" font-size="18" fill="#e7ecf6">104.16.132.229</text>
      <text x="512" y="166" text-anchor="end" font-size="22" font-weight="700" fill="#34d399">41</text>
      <!-- row 2 -->
      <rect x="288" y="186" width="240" height="40" rx="9" fill="#0e1526"/>
      <text x="304" y="211" font-size="18" fill="#c6cde0">162.159.192.4</text>
      <text x="512" y="212" text-anchor="end" font-size="22" font-weight="700" fill="#22d3ee">57</text>
      <!-- row 3 -->
      <rect x="288" y="232" width="240" height="40" rx="9" fill="#0e1526"/>
      <text x="304" y="257" font-size="18" fill="#c6cde0">172.64.80.1</text>
      <text x="512" y="258" text-anchor="end" font-size="22" font-weight="700" fill="#22d3ee">68</text>
      <!-- row 4 -->
      <rect x="288" y="278" width="240" height="40" rx="9" fill="#0e1526"/>
      <text x="304" y="303" font-size="18" fill="#c6cde0">104.18.22.7</text>
      <text x="512" y="304" text-anchor="end" font-size="22" font-weight="700" fill="#9d4efb">83</text>
    </g>
  </g>

  <!-- ===== RIGHT: title column (centered in right half) ===== -->
  <g>
    <!-- N mark -->
    <rect x="818" y="52" width="76" height="76" rx="20" fill="#0c1120" stroke="url(#brand)" stroke-width="2"/>
    <circle cx="856" cy="90" r="24" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.5"/>
    <circle cx="856" cy="90" r="14" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.35"/>
    <path d="M840 106 L840 74 L872 106 L872 74" fill="none" stroke="url(#brand)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="856" y1="90" x2="878" y2="72" stroke="#22d3ee" stroke-width="2"/>

    <text x="856" y="180" text-anchor="middle" direction="rtl" font-size="24" fill="#22d3ee">اسکنر IP سالم کلودفلر</text>
    <text x="856" y="256" text-anchor="middle" direction="rtl" font-size="82" font-weight="800" fill="url(#brandH)">نوا رادار</text>
    <text x="856" y="304" text-anchor="middle" direction="rtl" font-size="24" fill="#aeb6cc">اپلیکیشن دسکتاپ برای یافتن سریع‌ترین IPها</text>

    <!-- meta pills -->
    <g>
      <rect x="962" y="336" width="96" height="34" rx="17" fill="#0e1526" stroke="#1e2740" stroke-width="1"/>
      <text x="1010" y="358" text-anchor="middle" font-size="16" fill="#c6cde0">Go 1.25</text>
      <rect x="856" y="336" width="100" height="34" rx="17" fill="#0e1526" stroke="#1e2740" stroke-width="1"/>
      <text x="906" y="358" text-anchor="middle" font-size="16" fill="#c6cde0">React 19</text>
      <rect x="750" y="336" width="100" height="34" rx="17" fill="#0e1526" stroke="#1e2740" stroke-width="1"/>
      <text x="800" y="358" text-anchor="middle" font-size="16" fill="#c6cde0">Wails v3</text>
    </g>
  </g>
</svg>
